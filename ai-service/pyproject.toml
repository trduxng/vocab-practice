[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-ai-service"
version = "0.1.0"
description = "FastAPI AI service for VocaBoost"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "googletrans>=4.0.2",
  "pyodbc>=5.2.0"
]

[tool.uvicorn]
factory = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
