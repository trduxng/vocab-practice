version: '3.8'

services:
  # Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vocaboost-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123
    ports:
      - "1433:1433"

  # Backend API (Express)
  backend:
    build: ./backend
    container_name: vocaboost-api
    environment:
      - PORT=3001
      - DB_USER=sa
      - DB_PASSWORD=YourStrongPassword123
      - DB_SERVER=sqlserver
      - DB_NAME=ToeicVocabularyPlatform
      - JWT_SECRET=your_production_jwt_secret
    ports:
      - "3001"
    depends_on:
      - sqlserver

  # API Gateway (Gin)
  gin-gateway:
    build:
      context: ./gin-gateway
      target: ${GIN_TARGET:-dev}
    container_name: vocaboost-gateway
    environment:
      - PORT=8080
      - UPSTREAM_URL=http://backend:3001
      - JWT_SECRET=${JWT_SECRET:-your_production_jwt_secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - backend
    develop:
      watch:
        - path: ./gin-gateway
          action: sync
          ignore:
            - tmp/

  # Frontend Web
  frontend:
    build: ./frontend
    container_name: vocaboost-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - gin-gateway
